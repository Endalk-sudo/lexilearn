<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="100%" style="stop-color:#5b3df5"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0edff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2d1b69" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Open book -->
  <g filter="url(#shadow)">
    <!-- Left page -->
    <path d="M 128 168 C 128 156, 138 148, 150 148 L 256 148 L 256 340 L 150 340 C 138 340, 128 332, 128 320 Z" fill="url(#page)"/>
    <!-- Right page -->
    <path d="M 384 168 C 384 156, 374 148, 362 148 L 256 148 L 256 340 L 362 340 C 374 340, 384 332, 384 320 Z" fill="url(#page)"/>
    <!-- Center spine -->
    <line x1="256" y1="148" x2="256" y2="340" stroke="#d4ccf7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text lines on left page -->
  <g stroke="#c4b8f0" stroke-width="8" stroke-linecap="round">
    <line x1="158" y1="196" x2="228" y2="196"/>
    <line x1="158" y1="224" x2="228" y2="224"/>
    <line x1="158" y1="252" x2="210" y2="252"/>
    <line x1="158" y1="280" x2="228" y2="280"/>
    <line x1="158" y1="308" x2="200" y2="308"/>
  </g>

  <!-- Text lines on right page -->
  <g stroke="#c4b8f0" stroke-width="8" stroke-linecap="round">
    <line x1="284" y1="196" x2="354" y2="196"/>
    <line x1="284" y1="224" x2="354" y2="224"/>
    <line x1="284" y1="252" x2="340" y2="252"/>
    <line x1="284" y1="280" x2="354" y2="280"/>
    <line x1="284" y1="308" x2="330" y2="308"/>
  </g>

  <!-- Spark / star accent -->
  <g transform="translate(370, 120)">
    <path d="M 0 -28 C 3 -8, 8 -3, 28 0 C 8 3, 3 8, 0 28 C -3 8, -8 3, -28 0 C -8 -3, -3 -8, 0 -28 Z" fill="#ffd66e"/>
    <circle cx="0" cy="0" r="6" fill="#fff3d6"/>
  </g>

  <!-- Small spark -->
  <g transform="translate(130, 380) scale(0.5)">
    <path d="M 0 -28 C 3 -8, 8 -3, 28 0 C 8 3, 3 8, 0 28 C -3 8, -8 3, -28 0 C -8 -3, -3 -8, 0 -28 Z" fill="#a78bfa"/>
  </g>
</svg>